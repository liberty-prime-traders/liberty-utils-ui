@if(summaryLoading()) {
  <p-progress-spinner/>

} @else {
  <div class="p-2">
    <p-tabs value="Debtors">
      <p-tablist>
        @for(tab of tabItems; track tab.label){
          <p-tab [value]="tab.label" class="flex items-center gap-2">
            <i [class]="tab.icon"></i>
            <span>{{ tab.label }}</span>
          </p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="Debtors">
          <div class="flex flex-wrap gap-8">
            <div class="md:col-3 col-12">
              <h4>Top Debtors</h4>
              @for (debtor of $summary().topDebtors; track debtor.id) {
                <div class="flex justify-content-between py-2">
                  <div> {{debtor.fullName}}</div>
                  <div class="text-right">
                    <lbu-money [amount]="debtor.amount" />
                  </div>
                </div>
              }
            </div>

            <div class="md:col-4 col-12">
              <p-chart type="pie" [data]="debtorsData()" [options]="pieOptions"/>
            </div>
          </div>
        </p-tabpanel>

        <p-tabpanel value="Creditors">
          <div class="flex flex-wrap gap-8">
            <div class="md:col-3 col-12">
              <h4>Top Creditors</h4>
              @for (creditor of $summary().topCreditors; track creditor.id) {
                <div class="flex justify-content-between py-2">
                  <div> {{creditor.fullName}}</div>
                  <div class="text-right">
                    <lbu-money [amount]="creditor.amount" />
                  </div>
                </div>
              }
            </div>

            <div class="md:col-4 col-12">
              <p-chart type="pie" [data]="$creditorsData()" [options]="pieOptions"/>
            </div>

          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
}

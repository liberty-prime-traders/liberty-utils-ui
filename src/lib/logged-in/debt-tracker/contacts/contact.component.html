<div class="grid gap-2">

  @if (!screenSizeService.$isTabletPortraitAndBelow() || !$selectedPersonId()) {
    <div class="md:col-4 xl:col-3 flex-grow-1">
      <p-card>
        <div class="flex flex-column gap-3 mt-3">

          <p-iconfield iconPosition="left">
            <p-inputicon class="pi pi-search" />
            <input type="text"
                   pInputText
                   class="w-full"
                   placeholder="Search by name or relationship..."
                   [(ngModel)]="searchTerm">
          </p-iconfield>

          <cdk-virtual-scroll-viewport [itemSize]="50" style="height: 700px">
            <div *cdkVirtualFor="let person of $filteredContacts()" class="example-item">
              <a class="flex align-items-center justify-content-between p-2 hover:bg-gray-100 cursor-pointer"
                   [ngClass]="{'bg-gray-50': person.id === $selectedPersonId()}"
                   (click)="openDetails(person.id!)">
                <lbu-avatar [contact]="person"/>
                <lbu-money [amount]="person.balance" size="text-sm"/>
              </a>
            </div>
          </cdk-virtual-scroll-viewport>

          @if($filteredContacts().length === 0) {
            <div class="text-center py-4">
              No person found.
            </div>
          }
        </div>
      </p-card>
    </div>
  }

  <div class="col-12 lg:col-7 xl:col-8">
    <router-outlet />
  </div>

</div>

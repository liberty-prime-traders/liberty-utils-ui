<p-table [value]="auditRecords()"
         [loading]="loading()"
         scrollable="true"
         scrollHeight="400px"
         sortField="fieldName"
         #auditTable
         [globalFilterFields]="['fieldName', 'oldValue', 'newValue', 'changedBy']">

  <ng-template pTemplate="caption">
    <lbu-grid-filter [dataTable]="auditTable"/>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th>Field</th>
      <th>Old Value</th>
      <th>New Value</th>
      <th>Changed By</th>
      <th>Changed On</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-auditRecord>
    <tr>
      <td>{{auditRecord.fieldName | auditFieldLabel}}</td>
      <td>{{auditRecord.oldValue}}</td>
      <td>{{auditRecord.newValue}}</td>
      <td>{{auditRecord.changedBy}}</td>
      <td>{{auditRecord.changedOn | date : 'medium'}}</td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" class="h-4rem">Record has no History</td>
    </tr>
  </ng-template>
</p-table>
